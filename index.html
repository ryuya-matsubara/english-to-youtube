  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const questions = $('question-data').textContent.trim().split('\n').map(line => {
        const [category, ja, en, ipa] = line.split('|');
        return { category, ja, en, ipa };
      });
      let order = [];
      let previous = -1;
      let current = null;

      function refill() {
        order = Array.from({ length:questions.length }, (_, i) => i);
        for (let i = order.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
        if (order.length > 1 && order[order.length - 1] === previous) {
          [order[0], order[order.length - 1]] = [order[order.length - 1], order[0]];
        }
      }

      function nextQuestion() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (!order.length) refill();
        const index = order.pop();
        previous = index;
        current = questions[index];
        $('question').textContent = current.ja;
        $('english').textContent = '';
        $('ipa').textContent = '';
        $('answer').hidden = true;
        $('reveal').hidden = false;
        $('next').hidden = true;
        $('youtube').hidden = true;
        $('instagram').hidden = true;
        $('chatgpt').hidden = true;
      }

      function reveal() {
        if (!current) return;
        $('english').textContent = current.en;
        $('ipa').textContent = current.ipa;
        $('answer').hidden = false;
        $('reveal').hidden = true;
        $('next').hidden = false;
        $('youtube').hidden = false;
        $('instagram').hidden = false;
        $('chatgpt').hidden = false;
      }

      $('reveal').addEventListener('click', reveal);
      $('next').addEventListener('click', nextQuestion);
      if (!('speechSynthesis' in window)) {
        $('speak').hidden = true;
      } else {
        $('speak').addEventListener('click', () => {
          if (!current) return;
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(current.en);
          utterance.lang = 'en-US';
          utterance.rate = 0.88;
          window.speechSynthesis.speak(utterance);
        });
      }
      nextQuestion();
    })();
  </script>
